#ESP32-S3-Supermini
# ESP32, S3, with no PSRAM, 4mb flash, 2.4GHz WiFi, Bluetooth LE, USB-C, 33 GPIOs, castellated pins, battery charging circuit, and a built-in antenna.
# WS2812B LED built in (GPIO48) and enabled in this config
#https://s.click.aliexpress.com/e/_c34GRMSB

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    id: statusled
    name: "Status Light"